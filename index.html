<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz - O Mentalista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
<link href="style.css" rel="stylesheet">
</head>
<body>

<!-- ============ TELA INICIAL (fica parada na bancada) ============ -->
<section id="tela-inicio" class="tela ativa">
  <div class="fundo-inicio" aria-hidden="true"></div>

  <div class="conteudo-inicio container text-center">
    <svg class="logo-detetive" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="50" cy="50" r="48" fill="#1b1d29" stroke="#c8102e" stroke-width="2"/>
      <ellipse cx="50" cy="40" rx="16" ry="17" fill="#e8d4b8"/>
      <path d="M28 34 Q50 8 72 34 L72 30 Q50 14 28 30 Z" fill="#14151f"/>
      <rect x="24" y="26" width="52" height="8" rx="3" fill="#14151f"/>
      <path d="M20 30 Q50 20 80 30 L80 34 Q50 26 20 34 Z" fill="#14151f"/>
      <rect x="20" y="46" width="10" height="4" fill="#14151f"/>
      <rect x="70" y="46" width="10" height="4" fill="#14151f"/>
      <path d="M30 78 Q50 58 70 78 L70 92 L30 92 Z" fill="#c8102e"/>
      <rect x="46" y="72" width="8" height="14" fill="#eceef4"/>
    </svg>

    <p class="sobretitulo">Quiz para fãs da série</p>
    <h1 class="titulo-grande">O Mentalista</h1>
    <p class="pergunta-gancho">Você consegue ler as pessoas como Patrick Jane?</p>

    <button id="btn-comecar" class="btn btn-comecar" disabled>
      <span class="spinner-border spinner-border-sm me-2" id="spin-inicio" role="status"></span>
      <span id="txt-comecar">Carregando perguntas...</span>
    </button>
    <p class="dica-teclado d-none d-md-block" id="dica-inicio">ou pressione <kbd>Enter</kbd></p>

    <div id="info-quiz" class="info-quiz d-none">
      <span><strong id="info-qtd">0</strong> perguntas</span>
      <span class="sep">•</span>
      <span><strong id="info-tempo">20</strong>s por pergunta</span>
      <span class="sep d-none d-md-inline">•</span>
      <span class="d-none d-md-inline">Dá pra jogar com <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd></span>
    </div>

    <div id="erro-inicio" class="alert alert-danger d-none mt-4 mx-auto" style="max-width:420px"></div>
  </div>

  <div class="curiosidade-wrap container">
    <div class="curiosidade" id="curiosidade">
      <span class="rotulo">Você sabia?</span>
      <span id="curiosidade-texto"></span>
    </div>
  </div>
</section>

<!-- ============ TELA DO QUIZ ============ -->
<section id="tela-quiz" class="tela">
  <div class="container quiz-container">
    <header class="quiz-topo">
      <div class="d-flex align-items-center gap-2">
        <span class="badge-pergunta" id="badge-pergunta">PERGUNTA 1 DE 4</span>
      </div>
      <div class="placar-pill" id="placar">
        <span class="estrela">&#9733;</span> <span id="placar-num">0</span>
      </div>
    </header>

    <div class="progress barra-geral" role="progressbar" aria-label="Progresso do quiz">
      <div id="barra-geral" class="progress-bar" style="width:0%"></div>
    </div>

    <div class="card card-quiz" id="card-pergunta">
      <div id="area-imagem"></div>

      <div class="timer-wrap">
        <div class="progress barra-timer" role="progressbar" aria-label="Tempo restante">
          <div id="barra-timer" class="progress-bar" style="width:100%"></div>
        </div>
        <span id="timer-num" class="timer-num">20</span>
      </div>

      <h2 id="texto-pergunta" class="texto-pergunta"></h2>
      <div id="opcoes" class="d-grid gap-2"></div>
      <p id="feedback" class="feedback" aria-live="polite"></p>
    </div>
  </div>
</section>

<!-- ============ TELA FINAL ============ -->
<section id="tela-fim" class="tela">
  <div class="container text-center fim-container">
    <div class="card card-quiz card-fim">
      <p class="sobretitulo mb-1">Resultado</p>
      <h2 id="fim-rank" class="rank-titulo"></h2>
      <p id="fim-frase" class="text-secondary mb-3"></p>

      <div class="anel" id="anel">
        <svg viewBox="0 0 120 120">
          <circle class="anel-fundo" cx="60" cy="60" r="52"/>
          <circle class="anel-valor" id="anel-valor" cx="60" cy="60" r="52"/>
        </svg>
        <div class="anel-texto">
          <span id="fim-pct">0%</span>
          <small id="fim-detalhe">0 de 0</small>
        </div>
      </div>

      <div id="fim-pontos" class="pontos-resumo" aria-label="Resumo das respostas"></div>

      <div class="d-grid gap-2 mt-4">
        <button id="btn-reiniciar" class="btn btn-comecar btn-sm-cta">Jogar novamente</button>
        <button id="btn-inicio" class="btn btn-link text-secondary">Voltar ao início</button>
      </div>
      <p class="text-secondary small mt-3 mb-0" id="fim-auto"></p>
    </div>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
